    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('debug-error-box');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-box';
          errDiv.style = 'position:fixed;top:10px;left:10px;right:10px;padding:20px;background:#7f1d1d;color:#fecaca;z-index:9999999;border-radius:12px;font-family:monospace;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,0.8);white-space:pre-wrap;border:1px solid #ef4444;';
          var title = document.createElement('div');
          title.style = 'font-weight:bold;color:#f87171;font-size:15px;margin-bottom:8px;';
          title.textContent = 'JavaScript Çalışma Hatası (Runtime Error):';
          errDiv.appendChild(title);
          document.body ? document.body.appendChild(errDiv) : document.documentElement.appendChild(errDiv);
        }
        var item = document.createElement('div');
        item.textContent = '[Hata]: ' + (e.message || 'Bilinmiyor') + '\n' + (e.error ? e.error.stack : (e.filename + ':' + e.lineno));
        errDiv.appendChild(item);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.getElementById('debug-error-box');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-box';
          errDiv.style = 'position:fixed;top:10px;left:10px;right:10px;padding:20px;background:#7f1d1d;color:#fecaca;z-index:9999999;border-radius:12px;font-family:monospace;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,0.8);white-space:pre-wrap;border:1px solid #ef4444;';
          var title = document.createElement('div');
          title.style = 'font-weight:bold;color:#f87171;font-size:15px;margin-bottom:8px;';
          title.textContent = 'Promise Hatası (Unhandled Rejection):';
          errDiv.appendChild(title);
          document.body ? document.body.appendChild(errDiv) : document.documentElement.appendChild(errDiv);
        }
        var item = document.createElement('div');
        var reason = e.reason;
        item.textContent = '[Promise Hata]: ' + (reason ? (reason.stack || reason.message || reason) : 'Bilinmiyor');
        errDiv.appendChild(item);
      });
